id = "herdr-utils"
name = "Herdr Utils"
version = "0.1.0"
# `herdr api snapshot`, the session read this plugin's client wraps, first
# shipped in herdr 0.7.2 (src/cli/api.rs gained the snapshot subcommand there;
# 0.7.1 has no api dispatch). Plugin actions and the `herdr plugin list --json`
# actions array arrived in 0.7.0, so 0.7.5 covers every surface this plugin uses.
min_herdr_version = "0.7.5"
description = "Small, toggleable herdr utilities: a keybinding guide and a catalog of recommended plugins"
platforms = ["linux", "macos"]

# The [[build]] hook provisions bin/hu on every install and update: it builds
# with a local Go toolchain and falls back to the prebuilt hu-<os>-<arch>
# release binary verified against the tag (the herdr-suite pattern). A working
# tree built with `herdr plugin link` runs no build, so it uses "make hu".
[[build]]
command = ["bash", "bin/ensure-binary.sh", "--in-tree"]

# Every tool is default off, so this hook does nothing but mention the container
# once per server socket until the user opts in. The hint is recorded in the
# plugin state directory, one entry per socket, and the hook never blocks a
# herdr start.
[[startup]]
command = ["bin/hu", "startup"]

# The single user-facing surface in v0.1.0: the keybinding guide. The plugin
# declares the action and binds it itself: the [[startup]] hook writes a fenced
# block on prefix+i into the herdr config (internal/keybind), so a fresh
# install works with no manual step; "hu keys remove" takes it off.
#
# hu which is a full-screen TUI, so the action opens the [[panes]] popup below
# (the herdr-suite pattern): an action command has no terminal of its own.
[[actions]]
id = "which"
title = "Open the keybinding guide"
description = "Open the keybinding guide for herdr; the tool is default off, so set tools.which = true first"
contexts = ["global"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin herdr-utils --entrypoint which --placement popup --focus"]

[[panes]]
id = "which"
title = "Keybinding guide"
description = "The herdr keybinding guide, grouped by source"
placement = "popup"
# The frame draws itself inside tui-kit's recommended bounds (60..160 wide,
# 16..40 tall) and fills whatever popup it gets, so the pane is sized in the
# middle of that range instead of hugging a guessed content height:
# 66% x 62% is about 118x31 on a 180x50 terminal and 158x37 on a 240x60 one,
# both inside the bounds, so the frame fills the popup with no empty band below
# its footer and no unused width beside it. 74%, the width this pane shipped
# with, is 177 cells on a 240-wide terminal — past the 160-cell maximum, which
# leaves a band the frame cannot use. A smaller terminal wins over the minimum:
# the frame is never wider or taller than its pane.
width = "66%"
height = "62%"
command = ["bin/hu", "which"]
